<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Page</title>
    <!-- FavIcon -->
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon" />
    <!-- Css -->
    <link rel="stylesheet" href="style.css" />
    <!-- Daisy UI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

    <!-- Tailwind css -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="min-h-screen max-w-md mx-auto bg-base-200">
    <header class="bg-base-200 border-b-2 border-gray-300 sticky top-0 z-10">
      <section class="flex justify-between items-center gap-4 py-4 w-11/12 mx-auto">
        <div class="left flex justify-between gap-2 items-center">
          <div class="w-20">
            <img src="./assets/logo.png" alt="" />
          </div>
          <div>
            <h2 class="text-neutral font-extrabold">
              $
              <span id="balance">45000</span>
            </h2>
            <p class="text-neutral/50">Available Balance</p>
          </div>
        </div>
        <div class="right">
          <a href="/index.html" class="btn text-gray-400">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>Log Out
          </a>
        </div>
      </section>
    </header>
    <main class="">
      <section class="w-11/12 mx-auto my-8 space-y-3">
        <h1 class="font-bold text-neutral text-3xl">
          Welcome to Pay<span class="text-primary">oo</span>
        </h1>
        <p class="text-neutral/50">
          Enjoy easy and convenient financial services with us. Cashout charge is low and
        </p>
      </section>
      <section class="btns bg-white py-6 px-2 w-11/12 mx-auto grid grid-cols-3 gap-4 mb-8">
        <button
          onclick="showOnly('add-money')"
          class="btn rounded-lg flex-col h-full py-4 space-y-1 hover:bg-primary-content hover:border-info"
        >
          <img src="./assets/opt-1.png" alt="" />
          <span class="text-neutral/50 text-[.6rem]">Add Money</span>
        </button>
        <button
          onclick="showOnly('cash-out')"
          class="btn rounded-lg flex-col h-full py-4 space-y-1 hover:bg-primary-content hover:border-info"
        >
          <img src="./assets/opt-2.png" alt="" />
          <span class="text-neutral/50 text-[.6rem]">Cashout</span>
        </button>
        <button
          onclick="showOnly('money-transfer')"
          class="btn rounded-lg flex-col h-full py-4 space-y-1 hover:bg-primary-content hover:border-info"
        >
          <img src="./assets/opt-3.png" alt="" />
          <span class="text-neutral/50 text-[.6rem]">Transfer Money</span>
        </button>
        <button
          onclick="showOnly('bonus')"
          class="btn rounded-lg flex-col h-full py-4 space-y-1 hover:bg-primary-content hover:border-info"
        >
          <img src="./assets/opt-4.png" alt="" />
          <span class="text-neutral/50 text-[.6rem]">Get Bonus</span>
        </button>
        <button
          onclick="showOnly('pay-bill')"
          class="btn rounded-lg flex-col h-full py-4 space-y-1 hover:bg-primary-content hover:border-info"
        >
          <img src="./assets/opt-5.png" alt="" />
          <span class="text-neutral/50 text-[.6rem]">Pay Bill</span>
        </button>
        <button
          class="btn rounded-lg flex-col h-full py-4 space-y-1 hover:bg-primary-content hover:border-info"
        >
          <img src="./assets/opt-6.png" alt="" />
          <span class="text-neutral/50 text-[.6rem]">Transactions</span>
        </button>
      </section>
      <!-- Add Money form -->
      <section id="add-money" class="w-11/12 mx-auto hidden">
        <h1 id="add-money-title" class="text-2xl text-neutral font-semibold">Add Money</h1>
        <div class="form mt-8">
          <div class="card bg-base-100 w-full bg-base-100">
            <div class="card-body">
              <fieldset class="fieldset space-y-2">
                <label class="label text-neutral-800 font-bold">Select A Bank</label>

                <select
                  id="select-bank"
                  class="select bg-base-200 rounded-full outline-none w-full text-neutral/60"
                >
                  <option value="" disabled selected>Select Bank</option>
                  <option value="brac">Brac Bank</option>
                  <option value="city">City Bank</option>
                  <option value="sjibl">SJIBL Bank</option>
                </select>

                <label class="label text-neutral-800 font-bold">Bank Account Number</label>
                <input
                  id="bank-account-number"
                  type="text"
                  class="input bg-base-200 rounded-full outline-none w-full"
                  placeholder="Enter 11 digit bank account number"
                  maxlength="11"
                  minlength="11"
                />
                <label class="label text-neutral-800 font-bold">Amount to Add</label>
                <input
                  id="add-money-amount"
                  type="number"
                  class="input bg-base-200 rounded-full outline-none w-full"
                  placeholder="Enter amount to add"
                />
                <label class="label text-neutral-800 font-bold">Pin Number</label>
                <input
                  id="add-money-pin"
                  type="password"
                  class="input bg-base-200 rounded-full outline-none w-full"
                  placeholder="Enter 4 digit pin number"
                  maxlength="4"
                  minlength="4"
                />
                <button id="add-money-btn" class="btn bg-primary mt-4 rounded-full text-base-100">
                  Add Money
                </button>
              </fieldset>
            </div>
          </div>
        </div>
      </section>

      <!-- Cash out form -->
      <section id="cash-out" class="w-11/12 mx-auto hidden">
        <h1 id="cash-out-title" class="text-2xl text-neutral font-semibold">Cash Out</h1>
        <div class="form mt-8">
          <div class="card bg-base-100 w-full bg-base-100">
            <div class="card-body">
              <fieldset class="fieldset space-y-2">
                <label class="label text-neutral-800 font-bold">Agent Number</label>
                <input
                  id="agent-number"
                  type="text"
                  class="input bg-base-200 rounded-full outline-none w-full"
                  placeholder="Enter 11 digit number"
                  maxlength="11"
                  minlength="11"
                />
                <label class="label text-neutral-800 font-bold">Amount</label>
                <input
                  id="cash-out-amount"
                  type="number"
                  class="input bg-base-200 rounded-full outline-none w-full"
                  placeholder="Enter amount to withdraw"
                />
                <label class="label text-neutral-800 font-bold">Pin Number</label>
                <input
                  id="cashout-pin"
                  type="password"
                  class="input bg-base-200 rounded-full outline-none w-full"
                  placeholder="Enter 4 digit pin number"
                  maxlength="4"
                  minlength="4"
                />
                <button id="cash-out-btn" class="btn bg-primary mt-4 rounded-full text-base-100">
                  Withdraw Money
                </button>
              </fieldset>
            </div>
          </div>
        </div>
      </section>

      <!-- Money Transfer -->
      <section id="money-transfer" class="w-11/12 mx-auto hidden">
        <h1 class="text-2xl text-neutral font-semibold">Transfer Money</h1>
        <div class="form mt-8">
          <div class="card bg-base-100 w-full bg-base-100">
            <div class="card-body">
              <fieldset class="fieldset space-y-2">
                <label class="label text-neutral-800 font-bold">User Account Number</label>
                <input
                  id="user-account-number"
                  type="text"
                  class="input bg-base-200 rounded-full outline-none w-full"
                  placeholder="Enter 11 digit number"
                  maxlength="11"
                  minlength="11"
                />
                <label class="label text-neutral-800 font-bold">Amount</label>
                <input
                  id="transfer-amount"
                  type="number"
                  class="input bg-base-200 rounded-full outline-none w-full"
                  placeholder="Enter amount to withdraw"
                />
                <label class="label text-neutral-800 font-bold">Pin Number</label>
                <input
                  id="transfer-pin"
                  type="password"
                  class="input bg-base-200 rounded-full outline-none w-full"
                  placeholder="Enter 4 digit pin number"
                  maxlength="4"
                  minlength="4"
                />
                <button id="transfer-btn" class="btn bg-primary mt-4 rounded-full text-base-100">
                  Send Now
                </button>
              </fieldset>
            </div>
          </div>
        </div>
      </section>

      <!-- Get bonus -->
      <section id="bonus" class="w-11/12 mx-auto hidden">
        <h1 id="bonus-title" class="text-2xl text-neutral font-semibold">Get Bonus</h1>
        <div class="form mt-8">
          <div class="card bg-base-100 w-full bg-base-100">
            <div class="card-body">
              <fieldset class="fieldset space-y-2">
                <label class="label text-neutral-800 font-bold">Enter Bonus Coupon</label>
                <input
                  id="coupon"
                  type="text"
                  class="input bg-base-200 rounded-full outline-none w-full"
                  placeholder="Enter your coupon"
                />

                <button id="coupon-btn" class="btn bg-primary mt-4 rounded-full text-base-100">
                  Send Now
                </button>
              </fieldset>
            </div>
          </div>
        </div>
      </section>

      <!-- Pay bill -->
      <section id="pay-bill" class="w-11/12 mx-auto hidden">
        <h1 id="pay-bill-title" class="text-2xl text-neutral font-semibold">Pay Bill</h1>
        <div class="form mt-8">
          <div class="card bg-base-100 w-full bg-base-100">
            <div class="card-body">
              <fieldset class="fieldset space-y-2">
                <label class="label text-neutral-800 font-bold">Select To Pay</label>

                <select
                  id="pay-bank"
                  class="select bg-base-200 rounded-full outline-none w-full text-neutral/60"
                >
                  <option value="" disabled selected>Select Bank</option>
                  <option value="brac">Brac Bank</option>
                  <option value="city">City Bank</option>
                  <option value="sjibl">SJIBL Bank</option>
                </select>

                <label class="label text-neutral-800 font-bold">Biller Account Number</label>
                <input
                  id="biller-number"
                  type="text"
                  class="input bg-base-200 rounded-full outline-none w-full"
                  placeholder="Enter account number"
                  maxlength="11"
                  minlength="11"
                />
                <label class="label text-neutral-800 font-bold">Amount to Pay</label>
                <input
                  id="pay-bill-amount"
                  type="number"
                  class="input bg-base-200 rounded-full outline-none w-full"
                  placeholder="Add Amount to pay"
                />
                <label class="label text-neutral-800 font-bold">Pin Number</label>
                <input
                  id="pay-bill-pin"
                  type="password"
                  class="input bg-base-200 rounded-full outline-none w-full"
                  placeholder="Enter 4 digit pin number"
                  maxlength="4"
                  minlength="4"
                />
                <button id="pay-bill-btn" class="btn bg-primary mt-4 rounded-full text-base-100">
                  Pay Now
                </button>
              </fieldset>
            </div>
          </div>
        </div>
      </section>

      <!-- Transaction -->
      <section id="Transaction" class="w-11/12 mx-auto">
        <div class="flex justify-between items-center mb-6">
          <h1 class="text-2xl text-neutral font-semibold">Transaction History</h1>
          <a class="text-[1rem] text-neutral/50 font-semibold" href="">View All</a>
        </div>
        <div id="transaction-card-container"></div>
      </section>
    </main>
    <script src="./scripts/machine.js"></script>
    <script src="./scripts/addMoney.js"></script>
    <script src="./scripts/cashOut.js"></script>
    <script src="./scripts/transfer.js"></script>
    <script src="./scripts/coupon.js"></script>
    <script src="./scripts/payBill.js"></script>
  </body>
</html>
