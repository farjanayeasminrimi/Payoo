<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <!-- FavIcon -->
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon" />
    <!-- Css -->
    <link rel="stylesheet" href="style.css" />
    <!-- Daisy UI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Tailwind css -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="min-h-screen max-w-md mx-auto bg-base-200">
    <div class="logo pt-20 w-3xs mx-auto">
      <img src="./assets/Logo-full.png" alt="" />
    </div>
    <div class="form mt-10">
      <div class="card bg-base-100 w-full max-w-sm mx-auto shrink-0 bg-base-100 shadow">
        <div class="card-body">
          <fieldset class="fieldset space-y-2">
            <label class="label text-neutral-800 font-bold">Mobile Number</label>
            <input
              type="text"
              class="input bg-base-200 rounded-full outline-none"
              placeholder="Enter your number"
              maxlength="11"
              minlength="11"
            />
            <label class="label text-neutral-800 font-bold">4 Digit Pin</label>
            <input
              type="text"
              class="input bg-base-200 rounded-full outline-none"
              placeholder="Enter 4 Digit Pin"
              maxlength="4"
              minlength="4"
            />
            <button class="btn bg-primary mt-4 rounded-full text-base-100">Login</button>
          </fieldset>
        </div>
      </div>
    </div>
    <script src="./scripts/script.js"></script>
  </body>
</html>
